{{ define "main" }}
  {{ partial "home-meetings.html" . }}

  <section class="section stat-bar" aria-label="Chapter at a glance">
    <div class="stat-bar__inner">
      <div class="stat-bar__item">
        <span class="stat-bar__number">250+</span>
        <span class="stat-bar__label">Members</span>
      </div>
      <div class="stat-bar__divider" aria-hidden="true"></div>
      <div class="stat-bar__item">
        <span class="stat-bar__number">Monthly</span>
        <span class="stat-bar__label">Meetups</span>
      </div>
      <div class="stat-bar__divider" aria-hidden="true"></div>
      <div class="stat-bar__item">
        <span class="stat-bar__number">Silicon Valley</span>
        <span class="stat-bar__label">San Jose · Sunnyvale · Santa Clara</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="prose">
      {{ .Content }}
    </div>
  </section>

  <section class="section section--alt">
    {{ partial "home-jobs.html" . }}
  </section>

  <section class="section">
    {{ partial "home-trainings.html" . }}
  </section>

  <section class="section section--alt">
    {{ partial "home-contact.html" . }}
  </section>
{{ end }}
